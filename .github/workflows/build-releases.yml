name: Build & Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Standalone App (.dmg)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pywebview pyobjc-framework-Cocoa pyobjc-framework-WebKit

      - name: Build macOS App Bundle
        run: |
          pyinstaller --clean --noconfirm litbuddy_mac.spec

      - name: Package macOS DMG
        run: |
          npm install --global create-dmg
          mkdir -p dist_dmg
          create-dmg dist/ResearchLoom.app dist_dmg/ || true
          
          # If create-dmg finishes or creates DMG, find it or package via hdiutil
          if [ -f dist_dmg/*.dmg ]; then
            mv dist_dmg/*.dmg dist/ResearchLoom-macOS-arm64.dmg
          else
            hdiutil create -volname "ResearchLoom" -srcfolder dist/ResearchLoom.app -ov -format UDZO dist/ResearchLoom-macOS-arm64.dmg
          fi

      - name: Upload macOS Artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/ResearchLoom-macOS-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Standalone App (.exe)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pywebview

      - name: Build Windows Executable
        run: |
          pyinstaller --clean --noconfirm litbuddy.spec

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist\ResearchLoom.exe' -DestinationPath 'dist\ResearchLoom-windows-x64.zip' -Force

      - name: Upload Windows Artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/ResearchLoom.exe
            dist/ResearchLoom-windows-x64.zip
            dist_setup/ResearchLoom-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android Tablet APK (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps
          cd ..

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
          cd ..

      - name: Sync Capacitor Android
        run: |
          cd frontend
          ./node_modules/.bin/cap sync android
          cd ..

      - name: Build Android Release APK with Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cd ../..
          mkdir -p dist_apk
          cp frontend/android/app/build/outputs/apk/release/app-release.apk dist_apk/ResearchLoom-android-tablet.apk

      - name: Upload Android Tablet APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist_apk/ResearchLoom-android-tablet.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Universal AppImage & Archive (.AppImage, .tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (WebKitGTK & Tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgirepository1.0-dev libgirepository-2.0-dev libcairo2-dev pkg-config file wget patchelf || sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgirepository1.0-dev libcairo2-dev pkg-config file wget patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pywebview PyGObject

      - name: Build Linux Standalone Binary with PyInstaller
        run: |
          cp frontend/public/logo.png icon.png
          pyinstaller --clean --noconfirm litbuddy_linux.spec

      - name: Package Linux AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps

          cp dist/ResearchLoom-linux-x86_64 AppDir/usr/bin/
          cp packaging/linux/com.sohamsans.researchloom.desktop AppDir/
          cp packaging/linux/com.sohamsans.researchloom.desktop AppDir/usr/share/applications/
          cp icon.png AppDir/researchloom.png
          cp icon.png AppDir/usr/share/icons/hicolor/512x512/apps/researchloom.png
          cp packaging/linux/AppRun AppDir/
          chmod +x AppDir/AppRun AppDir/usr/bin/ResearchLoom-linux-x86_64

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          ./squashfs-root/AppRun AppDir dist/ResearchLoom-linux-x86_64.AppImage

      - name: Package Linux Archive (.tar.gz)
        run: |
          mkdir -p package_linux
          cp dist/ResearchLoom-linux-x86_64 package_linux/
          cp icon.png package_linux/
          cp packaging/linux/com.sohamsans.researchloom.desktop package_linux/
          cp packaging/linux/install-linux.sh package_linux/
          chmod +x package_linux/install-linux.sh
          tar -czvf dist/ResearchLoom-linux-x86_64.tar.gz -C package_linux .

      - name: Upload Linux Artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/ResearchLoom-linux-x86_64.AppImage
            dist/ResearchLoom-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
