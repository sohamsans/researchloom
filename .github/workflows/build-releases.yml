name: Build & Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Standalone App (.dmg)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pywebview pyobjc-framework-Cocoa pyobjc-framework-WebKit

      - name: Build macOS App Bundle
        run: |
          pyinstaller --clean --noconfirm litbuddy_mac.spec

      - name: Package macOS DMG
        run: |
          npm install --global create-dmg
          mkdir -p dist_dmg
          create-dmg dist/ResearchLoom.app dist_dmg/ || true
          
          # If create-dmg finishes or creates DMG, find it or package via hdiutil
          if [ -f dist_dmg/*.dmg ]; then
            mv dist_dmg/*.dmg dist/ResearchLoom-macOS-arm64.dmg
          else
            hdiutil create -volname "ResearchLoom" -srcfolder dist/ResearchLoom.app -ov -format UDZO dist/ResearchLoom-macOS-arm64.dmg
          fi

      - name: Upload macOS Artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/ResearchLoom-macOS-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Standalone App (.exe)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pywebview

      - name: Build Windows Executable
        run: |
          pyinstaller --clean --noconfirm litbuddy.spec

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist\ResearchLoom.exe' -DestinationPath 'dist\ResearchLoom-windows-x64.zip' -Force

      - name: Upload Windows Artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/ResearchLoom.exe
            dist/ResearchLoom-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android Tablet APK (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps
          cd ..

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
          cd ..

      - name: Sync Capacitor Android
        run: |
          cd frontend
          ./node_modules/.bin/cap sync android
          cd ..

      - name: Build Android Release APK with Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cd ../..
          mkdir -p dist_apk
          cp frontend/android/app/build/outputs/apk/release/app-release.apk dist_apk/ResearchLoom-android-tablet.apk

      - name: Upload Android Tablet APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist_apk/ResearchLoom-android-tablet.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
