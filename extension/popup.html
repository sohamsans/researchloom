<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ResearchLoom Clipper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 360px; background: #090a0d; color: #ededed; padding: 12px; font-size: 13px; }
    
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #27272a; }
    .logo-group { display: flex; align-items: center; gap: 8px; }
    .logo-icon { width: 20px; height: 20px; border-radius: 4px; background: #2563eb; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 11px; color: #fff; }
    .title { font-size: 13px; font-weight: 600; color: #f4f4f5; letter-spacing: -0.2px; }
    
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 10px; font-weight: 500; padding: 2px 6px; border-radius: 9999px; }
    .badge.online { background: #064e3b; color: #34d399; border: 1px solid #059669; }
    .badge.offline { background: #450a0a; color: #f87171; border: 1px solid #dc2626; }
    
    .open-app-btn { background: #18181b; border: 1px solid #3f3f46; color: #e4e4e7; font-size: 10px; padding: 2px 7px; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
    .open-app-btn:hover { background: #27272a; color: #fff; }

    /* Navigation Tabs */
    .tabs { display: flex; gap: 4px; background: #121318; padding: 3px; border-radius: 6px; border: 1px solid #27272a; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 5px 0; border: none; background: transparent; color: #a1a1aa; font-size: 11px; font-weight: 500; border-radius: 4px; cursor: pointer; text-align: center; }
    .tab-btn.active { background: #27272a; color: #f4f4f5; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Card */
    .card { background: #121318; border: 1px solid #27272a; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .paper-title { font-size: 12px; font-weight: 600; color: #e4e4e7; line-height: 1.4; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .meta-line { font-size: 11px; color: #a1a1aa; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .meta-tag { background: #1f2028; border: 1px solid #3f3f46; border-radius: 4px; padding: 1px 5px; font-size: 10px; color: #d4d4d8; }

    .vault-status { margin-bottom: 10px; padding: 8px; border-radius: 6px; font-size: 11px; display: flex; align-items: center; gap: 6px; }
    .vault-status.new { background: #172554; border: 1px solid #1e40af; color: #93c5fd; }
    .vault-status.exists { background: #064e3b; border: 1px solid #047857; color: #6ee7b7; }

    .btn-group { display: flex; flex-direction: column; gap: 6px; }
    button.action { width: 100%; border: none; padding: 7px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s ease; }
    button.primary { background: #2563eb; color: #ffffff; }
    button.primary:hover { background: #1d4ed8; }
    button.primary:disabled { background: #3f3f46; color: #71717a; cursor: not-allowed; }
    button.secondary { background: #1c1d24; border: 1px solid #3f3f46; color: #e4e4e7; }
    button.secondary:hover { background: #27272a; }

    /* Search & Note Tab Elements */
    .search-input { width: 100%; background: #121318; border: 1px solid #27272a; border-radius: 6px; padding: 7px 10px; font-size: 12px; color: #f4f4f5; outline: none; margin-bottom: 8px; }
    .search-input:focus { border-color: #3b82f6; }
    .results-list { max-height: 200px; overflow-y: auto; divide-y: divide-zinc-900; }
    .result-item { padding: 6px 4px; font-size: 11px; border-bottom: 1px solid #1f2028; cursor: pointer; }
    .result-item:hover { background: #18181b; }
    .result-item-title { color: #f4f4f5; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .result-item-sub { color: #71717a; font-size: 10px; margin-top: 2px; }

    textarea.note-text { width: 100%; height: 90px; background: #121318; border: 1px solid #27272a; border-radius: 6px; padding: 8px; font-size: 12px; color: #f4f4f5; resize: none; outline: none; margin-bottom: 8px; }
    textarea.note-text:focus { border-color: #3b82f6; }

    .status-msg { margin-top: 6px; font-size: 11px; text-align: center; color: #10b981; }
    .error-msg { margin-top: 6px; font-size: 11px; text-align: center; color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-group">
      <div class="logo-icon">RL</div>
      <span class="title">ResearchLoom</span>
    </div>
    <div class="header-actions">
      <button class="open-app-btn" id="open-app-btn" title="Open Full Desktop Window">Open App</button>
      <span class="badge" id="conn-badge">Checking...</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="tab-clip">Clip Paper</button>
    <button class="tab-btn" data-tab="tab-search">Search Vault</button>
    <button class="tab-btn" data-tab="tab-note">Quick Note</button>
  </div>

  <!-- TAB 1: CLIP PAPER -->
  <div class="tab-content active" id="tab-clip">
    <div class="card" id="paper-card">
      <div class="paper-title" id="p-title">Detecting publication metadata...</div>
      <div class="meta-line">
        <span id="p-authors">Loading authors...</span>
      </div>
      <div class="meta-line">
        <span class="meta-tag" id="p-year">Year</span>
        <span class="meta-tag" id="p-venue">Venue</span>
        <span class="meta-tag" id="p-pdf">PDF</span>
      </div>
    </div>

    <div class="vault-status" id="vault-status-box" style="display: none;">
      <span id="vault-status-text">Checking vault...</span>
    </div>

    <div class="btn-group">
      <button class="action primary" id="clip-btn" disabled>Clip to Vault & Queue PDF</button>
      <button class="action secondary" id="bibtex-btn">Copy BibTeX</button>
    </div>
  </div>

  <!-- TAB 2: SEARCH VAULT -->
  <div class="tab-content" id="tab-search">
    <input type="text" class="search-input" id="vault-search-input" placeholder="Search papers in local vault...">
    <div class="results-list" id="vault-search-results">
      <div style="text-align: center; color: #71717a; padding: 20px 0; font-size: 11px;">Type to search vaulted literature</div>
    </div>
  </div>

  <!-- TAB 3: QUICK NOTE -->
  <div class="tab-content" id="tab-note">
    <textarea class="note-text" id="quick-note-text" placeholder="Jot down a hypothesis, thought, or quote..."></textarea>
    <button class="action primary" id="save-note-btn">Save to ResearchLoom Notes</button>
  </div>

  <div id="feedback-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
